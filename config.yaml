# 服务配置
server:
  host: "0.0.0.0"
  port: 8080

# Telegram 推送（可选）
telegram:
  enabled: false
  bot_token: "YOUR_BOT_TOKEN"
  chat_id: "YOUR_CHAT_ID"

# 家庭配置
homes:
  # 家庭A：当前机器（运行扫描器）
  家庭A:
    scanner_enabled: true
    subnet: "10.8.0.0/24"
  
  # 家庭B：其他机器（通过 CENTRAL_URL 上报）
  家庭B:
    scanner_enabled: false

# 设备映射（MAC 地址 -> 人员信息）
# 首次运行后会自动填充发现的未知设备
devices: {}
